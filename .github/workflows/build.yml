name: APK Derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Proje dosyalarini olustur
        run: |
          mkdir -p proje
          cd proje
          mkdir -p app app/src/main app/src/main/java/com/tarayici/app app/src/main/res/layout app/src/main/res/values
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.tarayici.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.tarayici.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Tarayici">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/tarayici/app/MainActivity.kt <<'EOF'
          package com.tarayici.app

          import android.annotation.SuppressLint
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Bundle
          import android.view.KeyEvent
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ProgressBar
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private lateinit var urlBar: EditText
              private lateinit var progress: ProgressBar

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)
                  urlBar = findViewById(R.id.urlBar)
                  progress = findViewById(R.id.progress)

                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.builtInZoomControls = true
                  webView.settings.displayZoomControls = false

                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                          url?.let { urlBar.setText(it) }
                      }
                  }
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView?, newProgress: Int) {
                          progress.progress = newProgress
                          progress.visibility = if (newProgress in 1..99) View.VISIBLE else View.GONE
                      }
                  }

                  findViewById<Button>(R.id.goBtn).setOnClickListener { loadFromBar() }
                  findViewById<Button>(R.id.backBtn).setOnClickListener { if (webView.canGoBack()) webView.goBack() }
                  findViewById<Button>(R.id.forwardBtn).setOnClickListener { if (webView.canGoForward()) webView.goForward() }
                  findViewById<Button>(R.id.refreshBtn).setOnClickListener { webView.reload() }

                  urlBar.setOnEditorActionListener { _, actionId, event ->
                      if (actionId == EditorInfo.IME_ACTION_GO ||
                          (event?.keyCode == KeyEvent.KEYCODE_ENTER && event.action == KeyEvent.ACTION_DOWN)
                      ) {
                          loadFromBar()
                          true
                      } else {
                          false
                      }
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) {
                              webView.goBack()
                          } else {
                              isEnabled = false
                              onBackPressedDispatcher.onBackPressed()
                          }
                      }
                  })

                  webView.loadUrl(HOME_URL)
              }

              private fun loadFromBar() {
                  val url = toUrl(urlBar.text.toString())
                  if (url.isNotEmpty()) {
                      webView.loadUrl(url)
                  }
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(urlBar.windowToken, 0)
                  webView.requestFocus()
              }

              private fun toUrl(input: String): String {
                  val text = input.trim()
                  if (text.isEmpty()) return ""
                  if (text.startsWith("http://") || text.startsWith("https://")) return text
                  val looksLikeAddress = !text.contains(" ") && text.contains(".")
                  return if (looksLikeAddress) {
                      "https://$text"
                  } else {
                      "https://www.google.com/search?q=" + Uri.encode(text)
                  }
              }

              companion object {
                  private const val HOME_URL = "https://www.google.com"
              }
          }
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true"
              android:orientation="vertical">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="8dp">

                  <EditText
                      android:id="@+id/urlBar"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:hint="Ara veya adres yaz"
                      android:imeOptions="actionGo"
                      android:inputType="textUri"
                      android:maxLines="1"
                      android:selectAllOnFocus="true"
                      android:singleLine="true" />

                  <Button
                      android:id="@+id/goBtn"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Git" />
              </LinearLayout>

              <ProgressBar
                  android:id="@+id/progress"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="3dp"
                  android:max="100"
                  android:visibility="gone" />

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/backBtn"
                      style="?android:attr/buttonBarButtonStyle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Geri" />

                  <Button
                      android:id="@+id/forwardBtn"
                      style="?android:attr/buttonBarButtonStyle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="İleri" />

                  <Button
                      android:id="@+id/refreshBtn"
                      style="?android:attr/buttonBarButtonStyle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Yenile" />
              </LinearLayout>
          </LinearLayout>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Tarayıcı</string>
          </resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Tarayici" parent="Theme.Material3.DayNight.NoActionBar" />
          </resources>
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Tarayici"
          include(":app")
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p proje assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tarayici-apk
          path: proje/app/build/outputs/apk/debug/app-debug.apk
