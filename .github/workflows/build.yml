name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje dosyalarini olustur
        run: |
          set -e
          mkdir -p proje/app/src/main/java/com/tarayici/app
          mkdir -p proje/app/src/main/res/values

          cat > proje/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Tarayici'
          include ':app'
          EOF

          cat > proje/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

          cat > proje/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > proje/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.tarayici.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.tarayici.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > proje/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application
                  android:label="Tarayici"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > proje/app/src/main/java/com/tarayici/app/MainActivity.java <<'EOF'
          package com.tarayici.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.LinkedHashSet;

          public class MainActivity extends Activity {
              WebView web;
              EditText urlBar;
              Button dlBtn;
              ProgressBar bar;
              final LinkedHashSet<String> found = new LinkedHashSet<>();

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 23 && Build.VERSION.SDK_INT <= 28) {
                      requestPermissions(new String[]{"android.permission.WRITE_EXTERNAL_STORAGE"}, 1);
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);

                  urlBar = new EditText(this);
                  urlBar.setSingleLine(true);
                  urlBar.setHint("Adres veya arama");
                  urlBar.setImeOptions(EditorInfo.IME_ACTION_GO);
                  top.addView(urlBar, new LinearLayout.LayoutParams(0, -2, 1f));

                  Button go = new Button(this);
                  go.setText("Git");
                  top.addView(go, new LinearLayout.LayoutParams(-2, -2));

                  dlBtn = new Button(this);
                  dlBtn.setText("\u2B07");
                  dlBtn.setVisibility(View.GONE);
                  top.addView(dlBtn, new LinearLayout.LayoutParams(-2, -2));

                  root.addView(top, new LinearLayout.LayoutParams(-1, -2));

                  bar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(100);
                  root.addView(bar, new LinearLayout.LayoutParams(-1, 8));

                  web = new WebView(this);
                  root.addView(web, new LinearLayout.LayoutParams(-1, 0, 1f));
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView v, int p) {
                          bar.setProgress(p);
                          bar.setVisibility(p >= 100 ? View.GONE : View.VISIBLE);
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView v, String u, Bitmap f) {
                          urlBar.setText(u);
                          found.clear();
                          dlBtn.setVisibility(View.GONE);
                      }

                      @Override
                      public void onPageFinished(WebView v, String u) {
                          String js = "(function(){var r=[];document.querySelectorAll('video,audio,source').forEach(function(e){var s=e.currentSrc||e.src;if(s&&s.indexOf('http')==0)r.push(s)});return r.join(' ');})()";
                          v.evaluateJavascript(js, new android.webkit.ValueCallback<String>() {
                              @Override
                              public void onReceiveValue(String val) {
                                  if (val == null) return;
                                  val = val.replace("\"", "").trim();
                                  if (val.isEmpty() || val.equals("null")) return;
                                  for (String x : val.split(" ")) addFound(x);
                              }
                          });
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          String l = u.toLowerCase();
                          if (l.contains(".mp4") || l.contains(".mp3") || l.contains(".m4a")
                                  || l.contains(".webm") || l.contains(".ogg") || l.contains(".wav")
                                  || l.contains(".mkv") || l.contains(".aac")) {
                              addFound(u);
                          }
                          return null;
                      }
                  });

                  web.setDownloadListener((u, ua, cd, mime, len) -> startDownload(u, ua, cd, mime));

                  go.setOnClickListener(v -> load());
                  urlBar.setOnEditorActionListener((tv, id, ev) -> {
                      load();
                      return true;
                  });
                  dlBtn.setOnClickListener(v -> showList());

                  web.loadUrl("https://www.google.com");
              }

              void addFound(final String u) {
                  runOnUiThread(() -> {
                      if (found.add(u)) {
                          dlBtn.setText("\u2B07 " + found.size());
                          dlBtn.setVisibility(View.VISIBLE);
                      }
                  });
              }

              void load() {
                  String t = urlBar.getText().toString().trim();
                  if (t.isEmpty()) return;
                  if (t.startsWith("http://") || t.startsWith("https://")) {
                      web.loadUrl(t);
                  } else if (t.contains(".") && !t.contains(" ")) {
                      web.loadUrl("https://" + t);
                  } else {
                      web.loadUrl("https://www.google.com/search?q=" + Uri.encode(t));
                  }
              }

              void showList() {
                  final ArrayList<String> list = new ArrayList<>(found);
                  String[] names = new String[list.size()];
                  for (int i = 0; i < names.length; i++) {
                      String n = URLUtil.guessFileName(list.get(i), null, null);
                      names[i] = n;
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Indir")
                          .setItems(names, (d, i) ->
                                  startDownload(list.get(i), web.getSettings().getUserAgentString(), null, null))
                          .show();
              }

              void startDownload(String u, String ua, String cd, String mime) {
                  try {
                      DownloadManager.Request r = new DownloadManager.Request(Uri.parse(u));
                      String name = URLUtil.guessFileName(u, cd, mime);
                      if (mime != null && !mime.isEmpty()) r.setMimeType(mime);
                      String ck = CookieManager.getInstance().getCookie(u);
                      if (ck != null) r.addRequestHeader("Cookie", ck);
                      if (ua != null) r.addRequestHeader("User-Agent", ua);
                      r.addRequestHeader("Referer", web.getUrl() == null ? u : web.getUrl());
                      r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                      ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(r);
                      Toast.makeText(this, "Indiriliyor: " + name, Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Hata: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              public boolean onKeyDown(int k, KeyEvent e) {
                  if (k == KeyEvent.KEYCODE_BACK && web.canGoBack()) {
                      web.goBack();
                      return true;
                  }
                  return super.onKeyDown(k, e);
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        run: gradle -p proje assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Tarayici-APK
          path: proje/app/build/outputs/apk/debug/*.apk
