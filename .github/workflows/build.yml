              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/backBtn"
                      style="?android:attr/buttonBarButtonStyle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:minWidth="0dp"
                      android:text="Geri"
                      android:textSize="12sp" />

                  <Button
                      android:id="@+id/forwardBtn"
                      style="?android:attr/buttonBarButtonStyle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:minWidth="0dp"
                      android:text="İleri"
                      android:textSize="12sp" />

                  <Button
                      android:id="@+id/homeBtn"
                      style="?android:attr/buttonBarButtonStyle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:minWidth="0dp"
                      android:text="Ana"
                      android:textSize="12sp" />

                  <Button
                      android:id="@+id/tabsBtn"
                      style="?android:attr/buttonBarButtonStyle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:minWidth="0dp"
                      android:text="Sekme 1"
                      android:textSize="12sp" />

                  <Button
                      android:id="@+id/menuBtn"
                      style="?android:attr/buttonBarButtonStyle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:minWidth="0dp"
                      android:text="Menü"
                      android:textSize="12sp" />
              </LinearLayout>
          </LinearLayout>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Tarayıcı</string>
          </resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Tarayici" parent="Theme.Material3.DayNight.NoActionBar" />
          </resources>
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Tarayici"
          include(":app")
          EOF      - name: Ikon ve ad
        run: |
          cd proje/app/src/main
          mkdir -p res/drawable res/mipmap-anydpi res/mipmap-anydpi-v26
          cat > res/values/colors.xml <<'EOF'
          <resources>
              <color name="ic_bg">#12B5B0</color>
          </resources>
          EOF
          cat > res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:scaleX="0.52"
                  android:scaleY="0.52"
                  android:translateX="19.2"
                  android:translateY="12.4">
                  <path
                      android:fillColor="#FFFFFF"
